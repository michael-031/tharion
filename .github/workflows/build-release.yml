name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create debug keystore
        shell: bash
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare signed APK asset
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.0"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          mkdir -p dist

          if [ -f "release/eltharion-v1.0.0.apk" ]; then
            echo "Using pre-built signed APK from release/eltharion-v1.0.0.apk"
            cp "release/eltharion-v1.0.0.apk" "dist/eltharion-${TAG}.apk"
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "dist/eltharion-${TAG}.apk"
          else
            echo "No pre-built APK found in release/eltharion-v1.0.0.apk"
            exit 1
          fi

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: eltharion-${{ env.RELEASE_TAG }}-apk
          path: dist/eltharion-${{ env.RELEASE_TAG }}.apk

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Updating existing release ${RELEASE_TAG}..."
            gh release upload "${RELEASE_TAG}" "dist/eltharion-${RELEASE_TAG}.apk" --clobber
          else
            echo "Creating new release ${RELEASE_TAG}..."
            gh release create "${RELEASE_TAG}" "dist/eltharion-${RELEASE_TAG}.apk" \
              --title "Eltharion ${RELEASE_TAG}" \
              --generate-notes
          fi
